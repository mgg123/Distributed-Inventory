spring.application.name=store

spring.datasource.url=jdbc:mysql://localhost:3306/store?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.data.redis.cluster.nodes=127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003

mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.id-type=assign_id

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

store.bucket.count=16
store.bucket.fallover-max-retries=3
store.merge.delay-ms=1000
store.merge.idle-qps-threshold=100
store.auto-lock.enabled=true
store.auto-lock.reserve-ratio=0.1
store.auto-lock.min-lock-quantity=100
store.auto-lock.max-active=2
store.auto-lock.trigger-ratio=0.3
store.auto-lock.check-interval-ms=500
store.auto-lock.expire-seconds=300
store.redis.fail-threshold=5
store.lock.wait-time-seconds=10
store.lock.lease-time-seconds=30

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.mgg.exp.store=INFO
logging.level.com.mgg.exp.store.infrastructure.mapper=DEBUG
