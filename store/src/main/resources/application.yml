spring:
  application:
    name: store
  datasource:
    url: jdbc:mysql://localhost:3307/store?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

store:
  bucket:
    count: 16
    fallover-max-retries: 3
  merge:
    delay-ms: 1000
    idle-qps-threshold: 100
  auto-lock:
    enabled: true
    reserve-ratio: 0.1
    min-lock-quantity: 100
    max-active: 2
    trigger-ratio: 0.3
    check-interval-ms: 500
    expire-seconds: 300
  redis:
    fail-threshold: 5
  lock:
    wait-time-seconds: 10
    lease-time-seconds: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mgg.exp.store: INFO
    com.mgg.exp.store.infrastructure.mapper: DEBUG
